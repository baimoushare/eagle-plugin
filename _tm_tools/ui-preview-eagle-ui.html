<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Eagle 家族 UI 预览（eagle-ui.js）</title>
<!--
  本地预览页：起本地服务(python -m http.server 8799)后浏览器打开。
  面板结构与 eagle-douyin-collector 一致，选择器灌入模拟 Eagle 数据，
  可完整点验:文件夹树搜索/展开/单选、标签勾选/最近/手输/Esc 关闭。
-->
<style>
    body {
        margin: 0;
        min-height: 100vh;
        /* 模拟抖音深色页面环境，检验毛玻璃面板在不同亮度下的观感 */
        background: linear-gradient(135deg, #16181d 0%, #1f232b 55%, #262b35 100%);
        font-family: "Segoe UI", system-ui, sans-serif;
    }
    .tip {
        position: fixed;
        left: 20px;
        bottom: 16px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 12px;
        z-index: 200000;
    }
    .tip b { color: rgba(255, 255, 255, 0.75); }
</style>
</head>
<body>
<div class="tip">
    本地静态预览（模拟 Eagle 数据）｜库版本 <b id="ui-version">未知</b><br>
    演示内容 = 抖音采集面板结构；可点开两个选择器验证弹层交互
</div>

<script src="../eagle-ui.js"></script>
<script>
    document.getElementById('ui-version').textContent = window.EagleUI.version;

    var launcher = EagleUI.createLauncher({
        title: '抖音采集',
        icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="12" height="8.5" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.1 10l2.1-2.3 2.3 2.8 2-1.7M8 15.5h7.5M18.4 6.2v10.1M15.9 13.9l2.5 2.5 2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    });
    document.body.appendChild(launcher.el);

    var panel = EagleUI.createPanel({});
    panel.el.innerHTML = `
<div class="egc-title">抖音采集<span class="egc-version">UI ${EagleUI.version}</span></div>
<div class="egc-status">正在存入 Eagle</div>
<div class="egc-progress">已收 24/87｜本轮已处理 18｜新存 36｜已存过跳过 5｜失败 0</div>
<div class="egc-field">
  <div class="egc-label">Eagle 目标文件夹</div>
  <div data-slot="folder-picker"></div>
</div>
<div class="egc-field">
  <div class="egc-label">标签（从 Eagle 点选或手动输入，仅保存到 Eagle）</div>
  <div data-slot="tag-picker"></div>
</div>
<div class="egc-field">
  <div class="egc-label">数量上限（0 = 采集全部）</div>
  <input class="egc-input" data-action="limit-input" type="number" min="0" step="1" value="0" />
</div>
<div class="egc-actions">
  <button type="button" class="egc-btn primary" disabled>存入 Eagle</button>
  <button type="button" class="egc-btn" disabled>本地下载</button>
  <button type="button" class="egc-btn" disabled>存当前作品到Eagle</button>
  <button type="button" class="egc-btn ghost">停止</button>
</div>
`;
    document.body.appendChild(panel.el);
    panel.open();
    launcher.setOpen(true);

    // —— 模拟 Eagle 文件夹树灌入 ——
    var folderPicker = EagleUI.createFolderPicker({
        multiple: false,
        rootLabel: '自动目录（抖音/作者）',
        onChange: function (ids) { console.log('[folder] 选中:', ids); },
    });
    panel.el.querySelector('[data-slot="folder-picker"]').appendChild(folderPicker.el);
    folderPicker.setFolders([
        { id: 'F1', name: '抖音', children: [
            { id: 'F11', name: '作者A', children: [] },
            { id: 'F12', name: '作者B', children: [] },
        ] },
        { id: 'F2', name: 'Eagle丨成长', children: [
            { id: 'F21', name: '01. 学习教程', children: [] },
            { id: 'F22', name: '01. 三维CG', children: [] },
        ] },
        { id: 'F3', name: '参考图库', children: [] },
    ]);

    // —— 模拟 Eagle 标签目录灌入 ——
    var tagPicker = EagleUI.createTagPicker({
        recent: ['参考图', '抖音'],
        onChange: function (selected) { console.log('[tag] 已选:', selected); },
        onRecentChange: function (recent) { console.log('[tag] 最近:', recent); },
    });
    panel.el.querySelector('[data-slot="tag-picker"]').appendChild(tagPicker.el);
    tagPicker.setTags([
        { name: '参考图', count: 231 },
        { name: '设计', count: 88 },
        { name: 'photo', count: 45 },
        { name: '抖音', count: 12 },
        { name: '教程', count: 7 },
        { name: '三维', count: 3 },
    ]);
    // 分组演示(X 脚本场景):灌入分组后列表按"分组/未分组"分区渲染
    tagPicker.setGroups([
        { id: 'g1', name: '素材库', tags: ['参考图', 'photo'] },
        { id: 'g2', name: '学习', tags: ['教程', '三维'] },
    ]);
    tagPicker.setSelected(['参考图'], true);
</script>
</body>
</html>
