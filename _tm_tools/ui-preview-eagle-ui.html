<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Eagle 家族 UI 预览（eagle-ui.js）</title>
<!--
  本地预览页：双击用浏览器打开即可看到 eagle-ui.js 渲染出的家族面板样式。
  面板内容结构与 eagle-douyin-collector 一致，仅静态演示，不连接 Eagle。
-->
<style>
    body {
        margin: 0;
        min-height: 100vh;
        /* 模拟抖音深色页面环境，检验毛玻璃面板在不同亮度下的观感 */
        background: linear-gradient(135deg, #16181d 0%, #1f232b 55%, #262b35 100%);
        font-family: "Segoe UI", system-ui, sans-serif;
    }
    .tip {
        position: fixed;
        left: 20px;
        bottom: 16px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 12px;
        z-index: 200000;
    }
    .tip b { color: rgba(255, 255, 255, 0.75); }
</style>
</head>
<body>
<div class="tip">
    本地静态预览，不连接 Eagle｜当前库版本 <b id="ui-version">未知</b><br>
    演示内容 = 抖音采集面板结构；改 eagle-ui.js 后刷新本页即可看到效果
</div>

<script src="../eagle-ui.js"></script>
<script>
    // ── 用共享库搭一个与抖音脚本完全一致的面板 ──
    document.getElementById('ui-version').textContent = window.EagleUI.version;

    var launcher = EagleUI.createLauncher({
        title: '抖音采集',
        icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="12" height="8.5" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.1 10l2.1-2.3 2.3 2.8 2-1.7M8 15.5h7.5M18.4 6.2v10.1M15.9 13.9l2.5 2.5 2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    });
    document.body.appendChild(launcher.el);

    var panel = EagleUI.createPanel({});
    panel.el.innerHTML = `
<div class="egc-title">抖音采集</div>
<div class="egc-status">正在存入 Eagle</div>
<div class="egc-progress">已收 24/87｜本轮已处理 18｜新存 36｜已存过跳过 5｜失败 0</div>
<div class="egc-field">
  <div class="egc-label">Eagle 目标文件夹</div>
  <select class="egc-select"><option value="">自动目录（抖音/作者）</option><option selected>　01. 三维CG</option></select>
</div>
<div class="egc-field">
  <div class="egc-label">标签（从 Eagle 点选或输入回车，仅保存到 Eagle）</div>
  <input class="egc-input" placeholder="搜索/输入标签后按 Enter" />
  <div class="egc-tags">
    <button type="button" class="egc-tag-chip is-selected">参考图 ×</button>
  </div>
  <div class="egc-tag-catalog">
    <button type="button" class="egc-tag-catalog-chip is-selected">参考图</button>
    <button type="button" class="egc-tag-catalog-chip">设计</button>
    <button type="button" class="egc-tag-catalog-chip">photo</button>
    <button type="button" class="egc-tag-catalog-chip">抖音</button>
  </div>
</div>
<div class="egc-field">
  <div class="egc-label">数量上限（0 = 采集全部）</div>
  <input class="egc-input" type="number" min="0" step="1" value="0" />
</div>
<div class="egc-actions">
  <button type="button" class="egc-btn primary" disabled>存入 Eagle</button>
  <button type="button" class="egc-btn" disabled>本地下载</button>
  <button type="button" class="egc-btn" disabled>存当前作品到Eagle</button>
  <button type="button" class="egc-btn ghost">停止</button>
</div>
`;
    document.body.appendChild(panel.el);
    panel.open();
    launcher.setOpen(true);
</script>
</body>
</html>
